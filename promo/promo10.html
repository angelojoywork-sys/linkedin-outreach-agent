<script>
// Outreach assistant promo v2: the real v2 UI on a MacBook, one continuous camera, no cross dissolves between shots.

// ---- every beat time lives here ----

// ---- raised assistant strip + draft ----

    'make it warmer and ask for a quick chat'.split(' ').forEach((w, i, arr) => { const ts = B.type[0] + i * (B.type[1] - B.type[0]) / arr.length, a = outCubic(prog(t, ts, ts + .28)); g.globalAlpha = a * fo; g.filter = `blur(${(1 - a) * 3 * CTS}px)`; g.fillText(w, x, y + (1 - a) * 3); g.filter = 'none'; x += g.measureText(w + ' ').width; });

let _tmp = null; const draftTmp = (w, h) => { const W2 = Math.ceil(w * CTS), H2 = Math.ceil(h * CTS); if (!_tmp) _tmp = document.createElement('canvas'); if (_tmp.width !== W2) { _tmp.width = W2; _tmp.height = H2; } return _tmp; };

// ---- the laptop body (vector, drawn once) ----
function drawLid() {   // space-gray MacBook Pro lid: black bezel, camera dot, navy chin with the model name (vector, any resolution)
  const g = ctx, w = 1818, h = 1233, R = [64, 64, 5, 5]; let gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#4b5364'); gr.addColorStop(.5, '#2c3341'); gr.addColorStop(1, '#222936');

const SUB = 12, SHUTTER = 0.5 / 25; let built = false;
