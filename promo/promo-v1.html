<html lang="en"><head><meta charset="utf-8"><title>Outreach assistant promo</title>
<style>html,body{margin:0;background:#000;height:100%}body{display:flex;align-items:center;justify-content:center}canvas{width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;display:block}</style></head>
<body><canvas id="c"></canvas>

<script>
// Outreach assistant promo (19s, 16:9). Real v2 screens (captured at 4x) as 3D panels, one continuous camera, shape morphs between shots.

const TOTAL = 19, FONT = '-apple-system, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif';
// ---- every beat time lives here ----

const cv = document.getElementById('c'); cv.width = W * SCALE; cv.height = H * SCALE; const MAIN = cv.getContext('2d'); let ctx = MAIN, NOW = 0, CTS = 1;

const WW = 1128, WH = 868, PAD = 70;
const GREEN = [1, 117, 79], BLUE = '#0a66c2', SPARK = new Path2D('M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z');
const WORLD = { win: [0, 0], strip: [170, -129.2], draft: [170, -298.5] };   // world (x right, y up) of each piece in its resting place, window centre = 0,0

// ---- window: pill -> list -> conversation -> sent -> app mark ----

      g.globalAlpha = .55 * (1 - k); g.strokeStyle = BLUE; g.lineWidth = 3; rr(g, sd[0] - 26 * k, sd[1] - 26 * k, sd[2] + 52 * k, sd[3] + 52 * k, 17 + 26 * k); g.stroke(); g.globalAlpha = 1; }

// ---- raised assistant strip ----

// ---- tiny vector chips that lift off the strip ----

const SUB = 6, SHUTTER = 0.5 / 25;

  const g = MAIN;   // text on top, crisp
  words(g, 'Ten new connections.', 124, B.head1[0], B.head1[1] + .3, t, 60);
  words(g, 'Each one already has a draft.', 124, B.head2[0], B.head2[1], t, 60);
  words(g, 'Written from their profile.', 104, B.head3[0], B.head3[1], t, 60);
  words(g, 'Say what to change.', 104, B.head4[0], B.head4[1], t, 60);
  words(g, 'Change it by voice or text.', 104, B.head5[0], B.head5[1], t, 60);
  words(g, 'You review. You send.', 104, B.head6[0], B.head6[1], t, 60);
  words(g, 'Outreach assistant', 690, B.wm, null, t, 92);
  words(g, 'Say hello, personally.', 770, B.tag, null, t, 38, { weight: 400, top: '#b7c0ca', bot: '#8a95a1' });
  const sa = outCubic(prog(t, B.spec, B.spec + 0.9)); if (sa > 0) { g.save(); g.globalAlpha = sa * .75; g.fillStyle = '#8a95a1'; g.font = `400 ${20 * SCALE}px ${FONT}`; g.textAlign = 'center'; g.letterSpacing = '0px'; g.fillText('Design concept. Not affiliated with LinkedIn. All people and messages are fictional.', W * SCALE / 2, 1030 * SCALE); g.restore(); }
}
window.TOTAL = TOTAL; window.renderAt = t => render(t);
window.ready = loadAll().then(() => { if (q.has('t')) render(parseFloat(q.get('t'))); else (function tick(n) { render((n / 1000) % TOTAL); requestAnimationFrame(tick); })(0); return true; });
