<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outreach assistant · messaging concept</title>
<meta name="description" content="A design study: say hello to your newest connections with AI-drafted intros you review, edit by voice, and send.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <span class="brand">LinkedIn concept</span>
    <nav class="nav" aria-label="Primary">
      <span>Home</span><span>My Network</span><span>Jobs</span><span class="on" aria-current="page">Messaging</span>
    </nav>
    <span class="disclaimer">Unofficial design study. Not affiliated with LinkedIn. All people and messages are fictional.</span>
  </div>
</header>

<main class="shell" id="shell" data-pane="list">
  <aside class="list" aria-label="Conversations">
    <div class="list-head">
      <h1>Messaging</h1>
      <div class="pills" role="group" aria-label="Filter">
        <button class="pill" type="button" data-filter="inbox" aria-pressed="false">Inbox</button>
        <button class="pill" type="button" data-filter="new" aria-pressed="true">Recently connected <span class="badge" id="badge"></span></button>
      </div>
      <p class="list-note" id="listNote" role="status"></p>
    </div>
    <ul class="convos" id="convos"></ul>
  </aside>
  <section class="pane" id="pane"></section>
</main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path d="M19 11.5l-7 7a4.5 4.5 0 01-6.4-6.4l7.4-7.4a3 3 0 014.2 4.2l-7.4 7.4a1.5 1.5 0 01-2.1-2.1l6.7-6.7"/></symbol>
  <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 14a4 4 0 007 0M9 9.8v.4M15 9.8v.4"/></symbol>
</svg>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
